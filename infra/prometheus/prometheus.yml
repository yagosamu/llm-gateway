# Scrapes the gateway instances running on the host. A 2 s interval keeps the chaos demo responsive;
# a production setup would use 15 to 30 s.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000", "host.docker.internal:8001"]
        labels:
          service: llm-gateway
