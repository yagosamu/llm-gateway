<script>
const ITEMS = [{"item": "1", "request": "Given this paragraph about Kevum, explain when it is typically consumed?\n\nContext:\nKevum or Kavum is a deep-fried Sri Lankan sweet made from rice flour and kithul (sugar-palm) treacle, with a number of variants adding additional ingredients. It is also known as oil cake. Kevum is traditionally given and consumed during celebrations of Sinhala and Tamil New Year.", "reference_answer": "Kevum is typically consumed during celebrations of Sinhala and Tamil New Year.", "candidate_answer": "Kevum is typically given and eaten during Sinhala and Tamil New Year celebrations."}, {"item": "2", "request": "How much did the United States pay for Alaska when it bought the land from Russia?", "reference_answer": "The United States paid Russia **$7.2 million** for Alaska in **1867**—about **2 cents per acre**.", "candidate_answer": "The United States paid $7.2 million for Alaska when it purchased the territory from Russia in 1867. This was negotiated by Secretary of State William H. Seward and is often referred to as \"Seward's Folly\" or \"Seward's Icebox\" because many Americans at the time thought it was a wasteful purchase. However, it proved to be an excellent investment, as Alaska is rich in natural resources including gold, oil, and fish."}, {"item": "3", "request": "Which of the following items would I need on a surf trip? Surfboard, leash, tent, knife, wetsuit, batteries, granola bars, bag of grapes, lead weights, a dump truck, the complete collection of Beach Boys albums on vinyl.", "reference_answer": "For a surf trip, I’d pack:\n\n- **Surfboard and leash:** Essentials.\n- **Wetsuit:** If the water is cold; otherwise, swimwear may suffice.\n- **Granola bars and a bag of grapes:** Good snacks.\n\nDepending on your plans:\n- **Tent:** If you’re camping.\n- **Knife:** Useful for camping, but not necessary for surfing.\n- **Batteries:** If your flashlight or other gear needs them.\n\nLeave behind:\n- **Lead weights:** Not needed for surfing.\n- **Dump truck:** Definitely overkill.\n- **Complete Beach Boys collection on vinyl:** Excellent theme music, impractical beach luggage.\n\nAlso bring **drinking water, sunscreen, and a towel**.", "candidate_answer": "# Items You'd Need for a Surf Trip\n\n**Essential:**\n- **Surfboard** - obviously!\n- **Leash** - keeps your board from floating away\n- **Wetsuit** - depends on water temperature, but very useful\n- **Granola bars** - good quick energy\n- **Bag of grapes** - hydration and snacks\n\n**Possibly useful:**\n- **Tent** - if you're camping/traveling for the trip\n- **Batteries** - for lights, cameras, etc.\n- **Knife** - multi-tool utility (ding repair kit, general camp use)\n\n**Not needed:**\n- **Lead weights** - no practical purpose for surfing\n- **Dump truck** - impractical and unnecessary\n- **Beach Boys vinyl collection** - nice to have at the beach house maybe, but not essential!\n\nSo you'd realistically want the first 5 items from my \"essential\" list, plus a tent if you're doing a trip away from home. The rest range from situationally useful to completely unnecessary."}, {"item": "4", "request": "Identify which instrument is string or percussion: Handchime, Nyatiti", "reference_answer": "- **Handchime:** Percussion instrument\n- **Nyatiti:** String instrument", "candidate_answer": "Handchime: percussion  \nNyatiti: string"}, {"item": "5", "request": "In the field of economics, what is considered a monopoly?", "reference_answer": "In economics, a **monopoly** is a market in which a single seller supplies a good or service that has **no close substitutes**.\n\nBecause buyers have few alternatives, the seller has substantial power to influence prices. Monopolies are usually protected by **barriers to entry**, such as patents, control of essential resources, government restrictions, or high startup costs.\n\nFor example, a local water utility may be a monopoly because building a competing pipe network would be prohibitively expensive.\n\nA large company is not necessarily a monopoly—the key is whether it faces meaningful competition in its market.", "candidate_answer": "In economics, a **monopoly** is a market in which a single seller—or a firm with overwhelming market power—supplies a product or service with no close substitutes. Because customers have few alternatives, the firm can influence prices or other market terms.\n\nMonopolies are often protected by barriers that make it difficult for competitors to enter, such as legal restrictions, control of essential resources, or very large startup costs. A sole seller isn’t necessarily a monopoly if customers can readily switch to close substitutes."}, {"item": "6", "request": "What should I look for when looking for a used car?", "reference_answer": "When buying a used car, focus on **its condition, history, and total cost—not just the asking price.**\n\n### 1. Choose a car that fits your budget\n- Set a budget that includes **taxes, registration, insurance, maintenance, and repairs**.\n- Research reliability and common problems for the exact **model year, engine, and transmission**.\n- Compare similar cars locally to judge whether the price is fair.\n\n### 2. Check its history and paperwork\n- Make sure the **VIN matches** on the car, title, and paperwork.\n- Check for accidents, title brands such as salvage or flood, mileage inconsistencies, and outstanding recalls.\n- Ask for service records, especially for major scheduled work such as a timing-belt replacement.\n- Confirm the seller owns the car and that any loan or lien will be cleared.\n\n**A clean history report isn’t proof that a car is problem-free:** accidents and repairs don’t always get reported.\n\n### 3. Inspect it in daylight\nLook for:\n- **Rust**, especially underneath and around structural areas.\n- Mismatched paint, uneven panel gaps, or other signs of collision repairs.\n- Fluid leaks, worn tires, and uneven tire wear.\n- Musty smells, damp carpets, or corrosion that could suggest water damage.\n- Working lights, windows, locks, air conditioning, heater, and electronics.\n\nAsk to see it **start from cold**. Listen for unusual noises and watch for excessive exhaust smoke. Dashboard warning lights should illuminate during the startup check, then go out as appropriate.\n\n### 4. Take a proper test drive\nTry city streets and highway speeds, where safe. Check that:\n- The engine accelerates smoothly and the transmission shifts normally.\n- Braking is smooth, without pulling, grinding, or strong vibration.\n- Steering feels stable and the car tracks straight.\n- There are no unusual rattles, clunks, or overheating.\n\n### 5. Get an independent inspection\n**Before buying, have a mechanic you choose perform a pre-purchase inspection.** Ideally, it should include a lift inspection, diagnostic scan, and an estimate of upcoming repairs. For an EV or hybrid, ask about battery health and remaining battery warranty.\n\nA seller refusing a reasonable independent inspection is a strong reason to walk away.\n\n### 6. Check the deal—not just the monthly payment\n- Get the **full out-the-door price** in writing.\n- Review financing rates, loan length, fees, warranties, and add-ons.\n- Understand whether it’s sold **“as is”** and what protections apply where you live.\n- Don’t assume you’ll have a cooling-off period or a right to return it.\n- Put any promised repairs or conditions in writing before paying.\n\n**Big red flags:** pressure to buy immediately, missing ownership documents, unexplained mileage discrepancies, flood damage, serious rust, or a price far below comparable cars.\n\nIf you share your **budget, location, and a few models you’re considering**, I can help you narrow down what to look for.", "candidate_answer": "# Key Things to Check When Buying a Used Car\n\n## Vehicle History\n- **Get a Carfax or AutoCheck report** to spot accidents, title issues, or service records\n- Check for flood damage, salvage titles, or odometer rollback\n\n## Mechanical Condition\n- Have a trusted mechanic inspect it before buying\n- Check fluid levels (oil, coolant, brake fluid)\n- Test the engine, brakes, transmission, and steering\n- Look for rust, leaks, or unusual sounds\n\n## Exterior & Interior\n- Examine paint for inconsistencies (signs of repainting)\n- Check all lights, wipers, and windows\n- Inspect tire tread and condition\n- Look for upholstery damage or odors\n\n## Mileage & Age\n- Consider typical annual mileage (12,000-15,000 miles/year is average)\n- Factor in the car's maintenance history\n\n## Documentation\n- Verify the VIN matches all paperwork\n- Confirm ownership history\n- Ask about warranty options\n\n## Test Drive\n- Drive in various conditions (highway, city, parking)\n- Feel for vibrations or pulling to one side\n- Test acceleration, braking, and handling\n\n## Pricing\n- Research the market value for that make/model/year\n- Compare prices across listings\n- Be prepared to negotiate\n\n**Pro tip:** Take your time and don't feel pressured. A good deal should feel right on all fronts."}, {"item": "7", "request": "Give me list of last 10 presidents of US.", "reference_answer": "Here are the **10 most recent U.S. presidents**, listed from most recent to oldest (counting Donald Trump once):\n\n1. **Donald Trump** — 2017–2021; 2025–present\n2. **Joe Biden** — 2021–2025\n3. **Barack Obama** — 2009–2017\n4. **George W. Bush** — 2001–2009\n5. **Bill Clinton** — 1993–2001\n6. **George H. W. Bush** — 1989–1993\n7. **Ronald Reagan** — 1981–1989\n8. **Jimmy Carter** — 1977–1981\n9. **Gerald Ford** — 1974–1977\n10. **Richard Nixon** — 1969–1974", "candidate_answer": "The 10 most recent **individuals** to serve as U.S. president, newest first:\n\n1. Donald Trump (2025–present; also 2017–2021)\n2. Joe Biden (2021–2025)\n3. Barack Obama (2009–2017)\n4. George W. Bush (2001–2009)\n5. Bill Clinton (1993–2001)\n6. George H. W. Bush (1989–1993)\n7. Ronald Reagan (1981–1989)\n8. Jimmy Carter (1977–1981)\n9. Gerald Ford (1974–1977)\n10. Richard Nixon (1969–1974)"}, {"item": "8", "request": "How can I choose a favorite professional basketball team?", "reference_answer": "A favorite team usually grows on you—you don’t have to pick the “right” one. Here are a few ways to find a connection:\n\n- **Start local.** A nearby team gives you a hometown connection, fellow fans, and a chance to attend games.\n- **Follow a player you enjoy.** Their skill, personality, or story can draw you in. Just know they may change teams.\n- **Find a style you like.** Watch for fast-paced offense, creative passing, tough defense, or a young roster developing together.\n- **Choose your kind of journey.** A contender offers big playoff moments; an underdog offers the fun of watching a team grow.\n- **Consider practical details.** Convenient game times and accessible broadcasts make a team easier to follow.\n- **Enjoy the identity.** Team history, fan culture, uniforms, and even the mascot are perfectly valid reasons.\n\n**Try a short audition:** Pick three teams, watch a couple of games from each, and notice whose wins make you happiest—and whose losses actually bother you. That’s often your answer.\n\nThere’s no loyalty test: you can follow several teams while figuring it out. If you tell me where you live and whether you prefer a powerhouse, an underdog, or a particular playing style, I can suggest a shortlist.", "candidate_answer": "# Ways to Choose a Favorite Basketball Team\n\n**Connection to location**\n- Root for your hometown or college team\n- Follow a team in a city you've lived in or feel connected to\n\n**Player appreciation**\n- Watch games and gravitate toward teams with players whose style you enjoy\n- Follow specific athletes you admire\n\n**Team history and culture**\n- Research team traditions, playing style, and values\n- Some people prefer underdog stories; others like winning dynasties\n\n**Practical viewing**\n- Start watching games and see which team naturally engages you\n- Try following a few teams before committing\n\n**Peer influence**\n- Friends and family often share team loyalty (can be fun or create rivalry)\n- Join fan communities to experience the culture\n\n**Let it develop naturally**\n- You don't have to force it—fandom often grows over time through exposure\n- It's okay to appreciate multiple teams initially\n\n**Personal factors**\n- Consider whether you prefer exciting offenses, strong defenses, young rosters, or veteran teams\n- Think about coaching styles or front office philosophies you respect\n\nThe key is spending time watching games and seeing what clicks. Your favorite team will likely emerge naturally as you discover which players, styles, and communities resonate with you most."}, {"item": "9", "request": "How to take care of indoor plants?", "reference_answer": "Indoor plants do best when their **light, watering, and soil match their needs**. Here are the basics:\n\n- **Find the right light.** Most common houseplants prefer bright, indirect light—near a window but out of harsh midday sun. Succulents and cacti usually need more direct sunlight.\n- **Check before watering.** For many leafy plants, water when the top 1–2 inches of soil feel dry. Water thoroughly until it drains out, then empty the saucer. Avoid a fixed watering schedule; plants often need less water in winter.\n- **Use pots with drainage holes.** Choose a potting mix suited to the plant, such as cactus mix for succulents or bark-based mix for orchids. Don’t let roots sit in water.\n- **Keep conditions steady.** Avoid heating vents, air-conditioning blasts, and cold drafts. Most houseplants are comfortable at typical indoor temperatures.\n- **Feed lightly.** During active growth, use a houseplant fertilizer according to its label. Reduce or pause feeding when growth slows.\n- **Do simple upkeep.** Remove dead leaves, gently wipe dust from foliage, and check regularly for pests—especially under leaves and around stems.\n- **Repot when needed.** If roots crowd the pot or grow through drainage holes, move the plant into a pot just one size larger.\n\n**Watch for clues:** yellow leaves can signal several issues, including overwatering; brown edges may come from dryness, salt buildup, or low humidity. Check the soil and growing conditions before changing your care.\n\nIf you have pets or young children, check whether the plant is toxic before bringing it home.\n\nWhat plants do you have, and how much window light do they get?", "candidate_answer": "# Indoor Plant Care Guide\n\n## **Watering**\n- Check soil moisture before watering (top inch should feel dry)\n- Most plants need water 1-2 times per week\n- Use room-temperature water\n- Avoid overwatering—it's the #1 cause of plant death\n\n## **Light**\n- Place plants near windows (south/west-facing for more light)\n- Rotate plants every 1-2 weeks for even growth\n- Low-light plants: pothos, snake plant, ZZ plant\n- High-light plants: succulents, cacti, herbs\n\n## **Humidity & Temperature**\n- Most plants prefer 40-60% humidity\n- Mist leaves or use a humidifier in dry climates\n- Keep away from cold drafts and heat vents\n- Ideal temperature: 60-75°F (15-24°C)\n\n## **Soil & Containers**\n- Use well-draining potting soil (not garden soil)\n- Repot every 12-18 months or when roots show\n- Ensure pots have drainage holes\n\n## **Feeding**\n- Fertilize during growing season (spring/summer)\n- Use balanced indoor plant fertilizer\n- Follow package instructions for frequency\n\n## **General Maintenance**\n- Wipe leaves monthly to remove dust\n- Prune dead/yellowing leaves\n- Check regularly for pests (spider mites, mealybugs)\n- Adjust care based on plant species\n\n**Tip:** Start with hardy plants like pothos or snake plants if you're a beginner!"}, {"item": "10", "request": "What was the Tower Chowk renamed?\n\nContext:\nRajendra Tower (Hindi: राजेंद्र टावर), locally known as Tower Chowk, is a historic clock tower in Gaya, Bihar, India. Built sometime between 1910 and 1914 during the British rule by the-then collector George Oldhum, it was renamed as Rajendra Tower after the first Indian president Dr. Rajendra Prasad in 1981 by the administration of Bihar's Chief Minister Jagannath Mishra. The tower is widely considered to be the symbol of the city.\n\nHistory\nThe clock tower was built during the British Raj by George Oldhum, the-then collector of Gaya district, which was under Bihar and Orissa Province sometime between 1910 and 1914. The clock tower gradually became symbolic for the city of Gaya. After the end of British rule in 1947, the clock tower eventually became the property of the new Indian state of Bihar. It was renamed Rajendra Tower in 1981 after Dr. Rajendra Prasad, the first President of India by the administration of Jagannath Mishra, the-then Chief Minister of Bihar. According to locals, there were four clocks in the tower on each side and people used to hear the chimes of the clock from meters away whereas pedestrians used to match their accurate time by taking the reference of the clock. Due to the presence of the clock tower, the area gradually became a commercial district and goes by the name of Tower Chowk.", "reference_answer": "Tower Chowk was renamed **Rajendra Tower** in 1981, in honor of Dr. Rajendra Prasad, India’s first President.", "candidate_answer": "Tower Chowk was renamed **Rajendra Tower** in 1981, after India’s first president, Dr. Rajendra Prasad."}, {"item": "11", "request": "What is the best day for cold calling?", "reference_answer": "For **B2B cold calling, Tuesday through Thursday are usually the best days**. If you need one day to start with, try **Wednesday**.\n\nGood time windows to test, in the prospect’s local time:\n- **10–11:30 a.m.**\n- **4–5 p.m.**\n\nMonday mornings often get swallowed by planning and meetings, while Friday afternoons tend to have lower engagement.\n\nThere’s no universal winner, though. **Track qualified conversations and meetings booked—not just answered calls**—to find what works for your audience.", "candidate_answer": "# Best Days for Cold Calling\n\n**Tuesday through Thursday** are generally considered optimal, with **Wednesday** often cited as the sweet spot.\n\n## Why these days work well:\n\n- **Monday**: People are catching up from the weekend; less receptive\n- **Tuesday-Thursday**: Settled into their week, in problem-solving mode, accessible\n- **Friday**: Winding down, rushing to finish tasks; lower engagement\n\n## Time matters too:\n\n- **10-11 AM** or **2-4 PM** tend to work better than early morning or late afternoon\n- Avoid lunch hours and end-of-day\n\n## Other considerations:\n\n- **Industry matters**: Sales reps, decision-makers, and busy executives have different rhythms\n- **Your market**: Different regions/industries may vary\n- **Consistency beats timing**: Regular, persistent calling often matters more than picking the \"perfect\" day\n\n## Pro tip:\nTrack your own results. The \"best\" day may be specific to your industry and target audience. Use your data to optimize rather than relying solely on general advice."}, {"item": "12", "request": "Classify the below companies based on their country of origin -\nLG Corporation, Samsung, Apple Inc., Tesla, Inc.", "reference_answer": "| Company | Country of origin |\n|---|---|\n| LG Corporation | South Korea |\n| Samsung | South Korea |\n| Apple Inc. | United States |\n| Tesla, Inc. | United States |", "candidate_answer": "- LG Corporation — South Korea\n- Samsung — South Korea\n- Apple Inc. — United States\n- Tesla, Inc. — United States"}, {"item": "13", "request": "Tell me which of these stores sells furnitures: Safeway, dollar tree, HEB, IKEA, home depot, walmart", "reference_answer": "These stores sell furniture:\n\n- **IKEA** — a wide range of home and office furniture.\n- **Home Depot** — indoor and outdoor furniture, with a broader selection online.\n- **Walmart** — home, office, and outdoor furniture.\n\n**Safeway, Dollar Tree, and HEB** generally don’t carry regular furniture selections, though some locations may offer occasional seasonal items.", "candidate_answer": "**IKEA, Home Depot, and Walmart** sell furniture. H‑E‑B may carry limited seasonal or outdoor items, but it isn’t typically a furniture store. Safeway and Dollar Tree generally don’t sell furniture."}, {"item": "14", "request": "List 3 cities on the east coast of Australia.", "reference_answer": "- Sydney, New South Wales\n- Brisbane, Queensland\n- Gold Coast, Queensland", "candidate_answer": "Here are 3 cities on the east coast of Australia:\n\n1. **Sydney, New South Wales** - Australia's largest city, known for the Opera House and Harbour Bridge\n2. **Brisbane, Queensland** - The capital of Queensland, located on the Brisbane River\n3. **Melbourne, Victoria** - Australia's second-largest city, known for its arts, culture, and coffee scene"}, {"item": "15", "request": "Write a stern email to your dog asking him not to chew on the couch leg anymore.", "reference_answer": "**Subject: Immediate Cessation of Couch-Leg Chewing**\n\nDear Dog,\n\nIt has come to my attention—again—that you have been chewing on the couch leg. This behavior is unacceptable and must stop immediately.\n\nThe couch is furniture, not a snack. Your chew toys, on the other hand, are specifically designed for this purpose. Please familiarize yourself with the distinction.\n\nGoing forward, I expect all chewing activities to be directed toward approved items. Looking adorable after the fact does not constitute an apology, nor does it repair the couch.\n\nConsider this your final written warning. Further incidents will result in restricted couch access and a mandatory review of your toy collection.\n\nI trust we understand each other.\n\nSternly,  \nYour Human", "candidate_answer": "**Subject: We Need to Talk About the Couch**\n\nDear Buddy,\n\nI am writing to you regarding a serious matter that has become impossible to ignore.\n\nThe couch leg is **not** a chew toy. I don't know how many times we need to go over this, but apparently several more times is the answer.\n\nI have provided you with:\n- Actual chew toys\n- Rope toys\n- Rawhide treats\n- A perfectly good Kong\n\nAnd yet, here we are. Again. With splinters on the hardwood floor and exposed wood where the leg used to be.\n\nThis behavior stops now. I'm not angry—I'm disappointed. You're better than this. You're smarter than this. And frankly, so am I for repeatedly hoping this would resolve itself.\n\nThere will be consequences. Reduced treat rations. Shorter walks. A serious review of your off-leash privileges.\n\nI expect this to improve immediately. We can have a good relationship, but it requires you to make better choices.\n\nThe couch leg is off-limits. Final answer.\n\nSincerely,\n\nYour Very Frustrated Human\n\n---\n\n*P.S. Don't think those sad eyes are going to work on me this time.*"}, {"item": "16", "request": "What are four universities in the state of Texas?", "reference_answer": "Four universities in Texas are:\n\n1. **The University of Texas at Austin** — Austin\n2. **Texas A&M University** — College Station\n3. **Rice University** — Houston\n4. **Texas Tech University** — Lubbock", "candidate_answer": "Four universities in Texas are:\n\n- The University of Texas at Austin\n- Texas A&M University\n- Rice University\n- Baylor University"}, {"item": "17", "request": "Why are all the planets and moons round in shape? What makes them round? Does there exist another shape?", "reference_answer": "**Gravity is what makes large planets and moons nearly round—but not all moons are round, and no planet is a perfect sphere.**\n\n### Why does gravity produce a round shape?\nGravity pulls a body’s material inward from every direction. When a body is large enough, this pull overcomes the strength of its rock or ice. Over long periods, high regions sink and material shifts until the body settles into a roughly spherical shape.\n\nA sphere is the natural result because, without rotation or other outside influences, no direction is special. Imagine a cube-shaped planet: its corners stick out farther than its faces, and gravity would gradually pull those protruding regions down, deforming the cube toward a sphere.\n\nThis balance between gravity and internal pressure is called **hydrostatic equilibrium**. Gas and liquid settle into it readily; solid rock and ice can also deform under enormous pressure over geological time.\n\n### Are there other shapes?\nYes:\n\n- **Flattened spheres:** Rotation makes planets bulge at the equator and flatten at the poles. Earth does this slightly; Saturn does it much more noticeably.\n- **Elongated bodies:** Rapid rotation or strong tidal forces from a nearby companion can stretch a body. The dwarf planet **Haumea** is an example of a strongly elongated body.\n- **Irregular, potato-like shapes:** Small objects have too little gravity to overcome the strength of their material. Many asteroids, comets, and moons—including Mars’s moons **Phobos and Deimos**—are irregular.\n- **Two-lobed shapes:** Some small bodies consist of two joined lobes, such as the comet **67P**.\n\nSo the rule is: **large bodies tend to become round because gravity dominates; small bodies can retain many other shapes because their material strength dominates.**", "candidate_answer": "# Why Planets and Moons Are Round\n\n## The Primary Force: Gravity\n\nThe answer comes down to **gravity**. Objects massive enough experience gravitational force pulling equally toward their center from all directions. This naturally produces a sphere—the shape with the smallest surface area for a given volume, requiring the least energy to maintain.\n\nWhen an object is large enough (roughly 600+ km in diameter), its own gravity overcomes the material strength of rock and metal, causing it to collapse into a sphere.\n\n## Does Another Shape Exist?\n\n**Yes, but rarely:**\n\n- **Very small bodies** (asteroids, small moons like Phobos or Eros) can be irregularly shaped because their gravity is too weak to overcome their structural rigidity. They remain potato-shaped or jagged.\n\n- **Neutron stars** are spheres like planets, but far denser.\n\n- **Black holes** are spherical (or rotating as oblate spheroids), but follow different physics.\n\n- **Theoretically**, a rapidly rotating body can bulge at the equator (oblate spheroid)—though planets are still roughly spherical.\n\n## The Bottom Line\n\n**Gravity wins.** Once an object gets massive enough, gravity molds everything into a sphere, regardless of what it's made of. It's not a choice—it's physics. The perfectly round shape is actually nature's solution to balancing gravitational forces in all directions."}, {"item": "18", "request": "Who was Lester Menke\n\nContext:\nLester D. Menke (December 16, 1918 – March 5, 2016) was a state Representative from the Iowa's 5th and 7th Districts. He served in the Iowa House of Representatives from 1973 to 1985, serving as Speaker pro Tempore from 1981 to 1985. After he served in the Iowa House, Menke served as a liaison between Governor Terry Branstad and the legislature for two years. Menke has a B.A. from Morningside College, where he later served as a member of the board of directors, and attended The University of Iowa College of Law for one year. He worked as a farm owner and for an insurance agency. He served on various school boards and served as president of the Iowa Association of School Boards and State Board of Public Instruction and as director of the National Association of State Boards of Education, as well as serving on the Iowa Educational Radio and Television Facilities Board. Menke received Morningside College's Distinguished Alumni award in 1975.", "reference_answer": "Lester D. Menke (December 16, 1918 – March 5, 2016) was an Iowa state legislator, farmer, insurance professional, and education leader. He represented Iowa’s 5th and 7th districts in the Iowa House of Representatives from 1973 to 1985, serving as **Speaker pro tempore from 1981 to 1985**. Afterward, he spent two years as a liaison between Governor Terry Branstad and the legislature.\n\nA graduate of Morningside College, Menke also attended the University of Iowa College of Law for one year. He served on several school boards and held leadership roles in state and national education organizations, including as president of the Iowa Association of School Boards and the State Board of Public Instruction.", "candidate_answer": "# Lester Menke\n\nLester D. Menke (1918–2016) was an Iowa politician and public servant. Key highlights of his life include:\n\n**Political Career:**\n- Served in the Iowa House of Representatives from 1973 to 1985, representing Iowa's 5th and 7th Districts\n- Served as Speaker pro Tempore from 1981 to 1985\n- Later worked as a liaison between Governor Terry Branstad and the legislature for two years\n\n**Education & Professional Background:**\n- Earned a B.A. from Morningside College\n- Attended The University of Iowa College of Law for one year\n- Worked as a farm owner and in the insurance industry\n\n**Community Service:**\n- Served on various school boards\n- Served as president of the Iowa Association of School Boards\n- Served on the State Board of Public Instruction and National Association of State Boards of Education\n- Served on the Iowa Educational Radio and Television Facilities Board\n- Member of Morningside College's board of directors\n\n**Honors:**\n- Received Morningside College's Distinguished Alumni Award in 1975\n\nHe lived from December 16, 1918, to March 5, 2016."}, {"item": "19", "request": "What Peloton instructor should I take a cycling class with for the following moods and why? Happy, Sad, Angry, Unmotivated", "reference_answer": "Here’s my mood-to-instructor lineup—based on their coaching styles, not a guarantee that every class will have the same vibe:\n\n| Mood | Instructor | Why |\n|---|---|---|\n| **Happy** | **Cody Rigsby** | His humor, playful commentary, and pop-heavy playlists make a ride feel like a party. Great when you want to celebrate your good mood rather than get overly serious about training. |\n| **Sad** | **Sam Yo** | His calm, warm encouragement can feel supportive without demanding that you suddenly be cheerful. Try a **low-impact ride** if you want gentle movement and a little breathing room. |\n| **Angry** | **Tunde Oyeneyin** | Her powerful coaching and challenging rides give that energy somewhere constructive to go. An **intervals ride** could be a good outlet—just keep the resistance and effort appropriate for you. |\n| **Unmotivated** | **Alex Toussaint** | His direct, energetic, accountability-focused coaching is a strong choice when you need a push to get moving. Start with a **short ride** so showing up feels manageable. |\n\n**Quick version:** Cody for joy, Sam for comfort, Tunde for release, Alex for a kick-start.", "candidate_answer": "| Mood | Try | Why |\n|---|---|---|\n| **Happy** | **Cody Rigsby** | His playful, high-energy classes and pop-culture banter can make a good mood even more fun. |\n| **Sad** | **Christine D’Ercole** | Her thoughtful, encouraging coaching often makes room for reflection without demanding that you feel upbeat. |\n| **Angry** | **Alex Toussaint** | His intense, confident coaching can help you channel that energy into a powerful ride. |\n| **Unmotivated** | **Robin Arzón** | She’s known for direct, energizing pep talks that can help get you moving when starting feels like the hardest part. |\n\nInstructor styles vary by class, so check the class description and music too—sometimes the right playlist is the real motivator."}, {"item": "20", "request": "Who adopted Superman as per the passage?\n\nContext:\nSuperman was born on the fictional planet Krypton and was named Kal-El. When he was a baby, his parents sent him to Earth in a small spaceship moments before Krypton was destroyed in a natural cataclysm. His ship landed in the American countryside, near the fictional town of Smallville. He was found and adopted by farmers Jonathan and Martha Kent, who named him Clark Kent. Clark developed various superhuman abilities, such as incredible strength and impervious skin. His adoptive parents advised him to use his abilities for the benefit of humanity, and he decided to fight crime. To protect his personal life, he changes into a colorful costume and uses the alias \"Superman\" when fighting crime. Clark resides in the fictional American city of Metropolis, where he works as a journalist for the Daily Planet. Superman's supporting characters include his love interest and fellow journalist Lois Lane, Daily Planet photographer Jimmy Olsen and editor-in-chief Perry White, and enemies such as Brainiac, General Zod, and his archenemy Lex Luthor.", "reference_answer": "Superman was adopted by farmers Jonathan and Martha Kent.", "candidate_answer": "Farmers Jonathan and Martha Kent adopted Superman, naming him Clark Kent."}, {"item": "21", "request": "Who is Sasha? How does her life compare to Becky?\n\nContext:\nA lonely twentysomething, Becky Green, becomes obsessed with the suicide of her estranged childhood friend Chloe and assumes a new identity as Sasha to engineer a \"chance\" meeting with Chloe's best friend, Livia, at an art event, followed by another run-in at a yoga class.\n\nSasha then infiltrates Chloe's group of close-knit friends. She also gains a job outside her genuine work experience through Livia's contacts as she attempts to discover why Chloe died. Through her new alter-ego, she leads a life that is far more exciting than her life as Becky.\n\nA series of flashbacks reveals that Becky had two missed calls from Chloe minutes before her death. As Sasha, Becky eventually uncovers the truth of Chloe’s clandestine activities she has hidden from her husband and friends.\n\nBecky starts an affair with Chloe's widowed husband, Elliot; whereas the rest of the group including Elliot's mother disapproves of their relationship. Elliot decides to run for election, Becky and Livia run his campaign along with Elliot's friend Nish.", "reference_answer": "Sasha is the new identity Becky Green adopts to infiltrate the close-knit circle of her estranged childhood friend, Chloe, and investigate why Chloe died.\n\nAs Becky, she is a lonely twentysomething with a relatively uneventful life. As Sasha, she gains access to an exciting social world, gets a job beyond her actual experience through Livia’s connections, begins an affair with Chloe’s widower, Elliot, and helps run his election campaign. Sasha’s life is much more socially connected and eventful, but it is built on deception and complicated by her investigation into Chloe’s death.", "candidate_answer": "Sasha is Becky Green’s invented identity. Becky uses it to get close to Chloe’s friends and investigate why Chloe died, while presenting herself as a more confident, exciting person.\n\nBecky’s real life is lonely and constrained; as Sasha, she gains access to Chloe’s close-knit social circle, a job through Livia’s connections, and a more adventurous life. But the identity is also a means of deception: Becky uses it to investigate Chloe, and her involvement deepens when she begins an affair with Chloe’s widower, Elliot."}, {"item": "22", "request": "List all the planets in our solar system with more than one moon.", "reference_answer": "The planets in our solar system with more than one moon are:\n\n- **Mars**\n- **Jupiter**\n- **Saturn**\n- **Uranus**\n- **Neptune**", "candidate_answer": "The planets with more than one moon are **Mars, Jupiter, Saturn, Uranus, and Neptune**."}, {"item": "23", "request": "What is the old name for The Go Between Bridge?\n\nContext:\nThe Go Between Bridge, formerly known as the Hale Street Link, is a toll bridge for vehicles, pedestrians and cyclists over the Brisbane River in inner-city Brisbane, Queensland, Australia. The bridge connects Merivale and Cordelia Streets in West End to Hale Street and the Inner City Bypass at Milton. It is Brisbane's first inner-city traffic bridge in 40 years and carries around 12,000 vehicles per day. The bridge opened to traffic on 5 July 2010 and is now operated by Transurban Queensland.", "reference_answer": "The old name for the Go Between Bridge was the **Hale Street Link**.", "candidate_answer": "The old name for The Go Between Bridge was the **Hale Street Link**."}, {"item": "24", "request": "I want to buy a new car. This is a difficult financial decision, but our car is 12 years old. Can you write some reasons I can give to my partner so she's on board with this decision.", "reference_answer": "You can make a good case for replacing a 12-year-old car—but the strongest approach is to explain **why it makes sense for your household**, rather than just trying to persuade her. Age alone doesn’t mean the car needs replacing.\n\nHere are reasons you could discuss, if they apply:\n\n- **Reliability:** “I want us to have a car we can count on, especially for work, family commitments, or longer trips.” This is stronger if your current car has had breakdowns or a mechanic expects major repairs.\n- **Safety:** “A newer car could give us better crash protection and features like automatic emergency braking.” Check the specific models, since features and safety ratings vary.\n- **More predictable expenses:** “I’d like to compare the cost of keeping this car—including likely repairs—with the cost of replacing it.” A newer car may reduce repair uncertainty, but payments, insurance, taxes, and depreciation can cost more overall.\n- **Planning instead of reacting:** “If replacement is likely in the next year or two, shopping while this car still works gives us time to compare options rather than buying urgently after a breakdown.”\n- **Better fit for your needs:** “Our needs have changed, and a replacement could improve fuel economy, space, comfort, or accessibility.” Focus on needs you both recognize, not just appealing upgrades.\n\nYou could open the conversation like this:\n\n> “I know replacing the car is a big financial decision, and I don’t want to rush it or dismiss your concerns. I’m worried about its reliability and whether we’ll face bigger repairs soon. Could we get a mechanic’s assessment, compare the cost of keeping it with replacing it, and agree on a budget together? I’d also be open to a reliable used car if that makes more sense.”\n\n**Bring numbers, not just reasons:** a repair estimate, the current car’s value, and the full replacement cost—including interest and insurance. Also ask what would make her comfortable with the decision. That turns it into a shared problem to solve rather than a case she has to accept.", "candidate_answer": "A 12-year-old car can be a good reason to **review your options**, but it doesn’t automatically mean you need a new one. You’ll probably have a better conversation if you make the case honestly and invite her to weigh the numbers with you.\n\nYou could say:\n\n> “I’d like us to look at whether replacing the car makes sense—not decide in advance that we have to. It’s 12 years old, and I’m concerned about reliability, upcoming repairs, and whether it still meets our needs. Let’s compare the cost of keeping it with the full cost of a replacement and decide together.”\n\nUseful points to discuss, if they’re true for your situation:\n\n- **Reliability:** Has it been breaking down, or would a failure disrupt work, childcare, or other commitments?\n- **Repair costs:** What repairs are likely soon, and how do those compare with the cost of replacing it? Get an independent inspection or mechanic’s estimate.\n- **Safety and practical needs:** Does it lack safety features you’d now value, or no longer suit your family’s needs?\n- **Total cost—not just the payment:** Compare insurance, fuel, maintenance, financing, depreciation, and taxes with the current car’s costs.\n- **A shared budget:** Agree on a maximum price and monthly cost, and make sure the purchase won’t crowd out savings or other priorities.\n- **Alternatives:** Consider repairing it, buying a newer used car, or waiting and saving more, alongside buying new.\n\nTry to present the decision as a joint problem to solve rather than a case she needs to be persuaded to accept."}, {"item": "25", "request": "Classify the following water bodies into oceans, seas, rivers and lakes- aral, pacific, baikal, superior, amazon, colorado, indian, arabian, north, baltic, okhotosk, tahoe, victoria, lena, danube, arctic, mekong", "reference_answer": "| Category | Water bodies |\n|---|---|\n| **Oceans** | Pacific, Indian, Arctic |\n| **Seas** | Arabian, North, Baltic, Okhotsk |\n| **Rivers** | Amazon, Colorado, Lena, Danube, Mekong |\n| **Lakes** | Aral, Baikal, Superior, Tahoe, Victoria |\n\n**Note:** Despite its name, the **Aral Sea** is classified as a lake because it is an inland body of water.", "candidate_answer": "# Classification of Water Bodies\n\n## **Oceans**\n- Pacific\n- Indian\n- Arctic\n\n## **Seas**\n- Arabian\n- North\n- Baltic\n- Okhotsk\n\n## **Rivers**\n- Amazon\n- Colorado\n- Lena\n- Danube\n- Mekong\n\n## **Lakes**\n- Aral\n- Baikal\n- Superior\n- Tahoe\n- Victoria"}, {"item": "26", "request": "What is an acoholic?", "reference_answer": "If you mean **“alcoholic,”** it usually refers to a person with **alcohol use disorder**—a condition where someone has difficulty controlling their drinking and continues despite harm to their health, relationships, or daily life.\n\n“Alcoholic” can also describe something that contains alcohol, like an alcoholic drink.", "candidate_answer": "An **alcoholic** is a common, sometimes stigmatizing term for someone who has **alcohol use disorder**—a pattern of drinking that’s hard to control and continues despite harm. Many people prefer “person with alcohol use disorder.” Drinking heavily doesn’t automatically mean someone has the disorder, but it can still be harmful."}, {"item": "27", "request": "Write a letter to my mom to convince her that I should be able to get a cat.", "reference_answer": "Dear Mom,\n\nI’d really love to get a cat, and I hope you’ll consider it. I know a pet is a big responsibility—not just something cute to play with—and I want to show you that I’m ready to take it seriously.\n\nA cat would be a wonderful companion, but I understand that it would also need daily care. I’m willing to handle feeding, fresh water, litter-box cleaning, and playtime. Before we make any decision, I’d like to work with you on a realistic plan for food, supplies, vet visits, and who would care for the cat when we’re away.\n\nI also want to hear your concerns, whether they’re about cost, allergies, mess, or the extra work. We could research those things together and visit a shelter to learn more about finding a cat whose personality fits our home—without committing right away.\n\nTo show you I’m serious, I’m willing to follow a regular chore schedule for a month first. That would give me a chance to demonstrate responsibility instead of just promising it.\n\nI’m not asking you to say yes without thinking it through. I’m asking for a chance to talk about it and show you that I can help give a cat a safe, loving home.\n\nLove,  \n[Your name]", "candidate_answer": "# Dear Mom,\n\nI hope you're having a great day! I wanted to talk to you about something that's really important to me – getting a cat.\n\nI've been thinking a lot about this, and I genuinely believe a cat would be a wonderful addition to our home. Here's why I think this is a good idea:\n\n**I'm ready for the responsibility.** I understand that a cat requires daily care – feeding, fresh water, a clean litter box, playtime, and attention. I'm committed to handling these tasks myself and not leaving them to you.\n\n**Cats are independent and low-maintenance.** Unlike some pets, cats are naturally independent and don't need constant supervision. They're great for our lifestyle and won't require extensive time commitments like a dog might.\n\n**There are real benefits for our family.** Studies show that pets reduce stress and anxiety, improve mood, and bring joy to a home. A cat's companionship would be good for all of us.\n\n**I've done my research.** I know about proper nutrition, veterinary care, environmental enrichment, and how to handle the financial costs. I'm not asking for this lightly.\n\n**I promise to be responsible.** I'll maintain the litter box, ensure the cat has food and water, take them to vet appointments when needed, and handle any messes or problems that arise.\n\nI really hope we can discuss this further. I'd love to show you more about what having a cat would mean, or even visit a shelter to see if the right cat might be waiting for us.\n\nThank you for considering it.\n\nLove,\n[Your name]"}, {"item": "28", "request": "What are Heat Shock proteins?\n\nContext:\nHeat shock proteins (HSP) are a family of proteins produced by cells in response to exposure to stressful conditions. They were first described in relation to heat shock, but are now known to also be expressed during other stresses including exposure to cold, UV light and during wound healing or tissue remodeling. Many members of this group perform chaperone functions by stabilizing new proteins to ensure correct folding or by helping to refold proteins that were damaged by the cell stress. This increase in expression is transcriptionally regulated. The dramatic upregulation of the heat shock proteins is a key part of the heat shock response and is induced primarily by heat shock factor (HSF). HSPs are found in virtually all living organisms, from bacteria to humans.", "reference_answer": "**Heat shock proteins (HSPs)** are a family of proteins that help protect cells from stress. Although first discovered in cells exposed to high temperatures, they also respond to stresses such as cold, UV radiation, injury, and tissue remodeling.\n\nMany HSPs act as **molecular chaperones**: they help newly made proteins fold correctly, stabilize proteins, and help damaged proteins refold. This helps prevent proteins from clumping together and supports cell survival.\n\nTheir production often increases during stress, largely through activation of **heat shock factors (HSFs)**, which regulate HSP gene expression. HSPs are found in virtually all living organisms, from bacteria to humans.", "candidate_answer": "Heat shock proteins (HSPs) are a family of proteins that cells produce in response to stress, such as heat, cold, UV exposure, injury, or tissue remodeling. Many act as molecular chaperones: they help newly made proteins fold correctly and help repair or refold proteins damaged by stress. Their production often rises through a cellular stress response regulated mainly by heat shock factor (HSF). HSPs occur in organisms from bacteria to humans."}, {"item": "29", "request": "Identify which instrument is string or percussion: Jew's Harp, Bass Stick", "reference_answer": "- **Jew’s Harp:** Percussion\n- **Bass Stick:** String", "candidate_answer": "# Instrument Classification\n\n**Jew's Harp** - String instrument\n- It's a small frame instrument with a flexible metal tongue that vibrates to produce sound\n\n**Bass Stick** - Percussion instrument\n- It's a wooden stick struck to produce percussive sounds, commonly used in folk music and rhythm sections"}, {"item": "30", "request": "Give me 3 ways you can cook eggs", "reference_answer": "1. **Scrambled:** Beat eggs with a pinch of salt, then cook in a buttered pan over medium-low heat, stirring gently until set.\n2. **Fried:** Crack an egg into a lightly oiled pan and cook until the white sets. Flip it if you want it over-easy or over-hard.\n3. **Hard-boiled:** Place eggs in a saucepan, cover with water, and bring to a boil. Turn off the heat, cover for 10–12 minutes, then cool in ice water and peel.", "candidate_answer": "# 3 Ways to Cook Eggs\n\n1. **Scrambled**\n   - Beat eggs with a splash of milk or cream\n   - Pour into a buttered pan over medium heat\n   - Stir gently until soft curds form\n   - Creamy and soft texture\n\n2. **Fried**\n   - Heat butter or oil in a pan\n   - Crack eggs directly into the pan\n   - Cook until whites are set (sunny-side up) or flip for over-easy, over-medium, or over-hard\n   - Yolk stays runny or becomes firmer depending on preference\n\n3. **Boiled**\n   - Place eggs in a pot of cold water\n   - Bring to a boil, then remove from heat\n   - Let sit covered (soft-boiled: 4-6 minutes, hard-boiled: 10-12 minutes)\n   - Cool and peel\n   - Great for meal prep or snacks\n\nEach method takes just a few minutes and offers different textures and flavors!"}];
const RUBRIC = "You grade whether a CANDIDATE answer is an acceptable substitute for a REFERENCE answer to the same request.\n\nAcceptable means that the person who sent the request would be about as well served by the candidate as by the reference:\n- It does what the request asks, including any format, length or style constraint stated in the request.\n- It makes no factual claim that contradicts the reference or the context given in the request, and invents no fact that matters to the request.\n- It is complete. An answer that stops in the middle is not acceptable.\n\nDo not reject for differences in wording, style, order or length when the request sets no constraint on them.\nFor open-ended requests (brainstorming, creative writing, opinions) there is no single right answer: judge whether the candidate is an on-task answer of similar usefulness, not whether it resembles the reference.\nThe reference can be wrong. If the candidate is right where the reference is wrong, the candidate is acceptable.\n\nGive your reason first, in one or two sentences, then the verdict.";
const KEY = "llm-gateway-human-grading-v1";
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { answers = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} render(); }
document.getElementById("rubric").textContent = RUBRIC;
const root = document.getElementById("items");
function block(label, text) {
  const l = document.createElement("div"); l.className = "label"; l.textContent = label;
  const t = document.createElement("div"); t.className = "text"; t.textContent = text;
  return [l, t];
}
for (const it of ITEMS) {
  const box = document.createElement("div"); box.className = "item"; box.id = "item-" + it.item;
  const h = document.createElement("h2"); h.textContent = "Item " + it.item + " de " + ITEMS.length;
  box.append(h, ...block("Pedido", it.request), ...block("Resposta de referência", it.reference_answer),
             ...block("Resposta candidata", it.candidate_answer));
  const choice = document.createElement("div"); choice.className = "choice label";
  choice.append("Aceitável?  ");
  for (const v of ["yes", "no"]) {
    const lab = document.createElement("label"); const r = document.createElement("input");
    r.type = "radio"; r.name = "a" + it.item; r.value = v;
    r.checked = (answers[it.item] || {}).acceptable === v;
    r.onchange = () => { answers[it.item] = {...(answers[it.item] || {}), acceptable: v}; save(); };
    lab.append(r, " " + (v === "yes" ? "sim (yes)" : "não (no)")); choice.append(lab);
  }
  const note = document.createElement("textarea"); note.placeholder = "Nota opcional (ajuda nos casos de não)";
  note.value = (answers[it.item] || {}).note || "";
  note.oninput = () => { answers[it.item] = {...(answers[it.item] || {}), note: note.value}; save(); };
  box.append(choice, note); root.append(box);
}
function render() {
  let n = 0;
  for (const it of ITEMS) {
    const ok = (answers[it.item] || {}).acceptable;
    document.getElementById("item-" + it.item).classList.toggle("done", !!ok); if (ok) n++;
  }
  document.getElementById("progress").textContent = n + " de " + ITEMS.length + " respondidos";
}
function csvCell(s) { return '"' + String(s || "").replace(/"/g, '""') + '"'; }
document.getElementById("download").onclick = () => {
  const missing = ITEMS.filter(it => !(answers[it.item] || {}).acceptable).map(it => it.item);
  if (missing.length && !confirm("Faltam os itens " + missing.join(", ") + ". Baixar mesmo assim?")) return;
  const lines = ["item,acceptable,note"].concat(ITEMS.map(it => {
    const a = answers[it.item] || {}; return [it.item, a.acceptable || "", csvCell(a.note)].join(",");
  }));
  const blob = new Blob([lines.join("\n") + "\n"], {type: "text/csv;charset=utf-8"});
  const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
  link.download = "answers.csv"; link.click();
};
render();
