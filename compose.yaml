# Local infrastructure for slice 3: Redis for shared health, breaker state and the deferrable queue;
# Prometheus scraping the gateway; Grafana for the dashboard. The gateway itself runs on the host
# (uv run uvicorn ...), one or two instances on ports 8000 and 8001.
#
# Every port is bound to 127.0.0.1, so nothing here is reachable from outside this machine.
# Usage: docker compose up -d    |    docker compose down

services:
  redis:
    image: redis:8.10.2
    # Health windows, breaker state and the queue live here; persistence is off on purpose, since a
    # local demo has nothing to keep across a Redis restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Local demo only: anonymous viewers, and the admin password comes from .env.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
