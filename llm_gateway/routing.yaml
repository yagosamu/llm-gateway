# Routing for requests sent with "model": "auto". The gateway reads this file again whenever it
# changes; an invalid edit is refused and the previous config stays in force.
#
# policy: always_low | always_medium | always_high | feature_table | classifier
# feature_table and classifier read their estimates from the file named in `estimates`, written by
# python -m harness.routing.train.
#
# always_low was chosen from the slice 2 measurement (results/slice2.md): on the recorded traffic it
# was as often acceptable as the learned policies (95.8%) at the lowest cost. The verifier is what
# watches that choice in production: it re-asks a sample of routed requests to the high tier, has a
# judge compare the answers, and records every verdict, within a daily spending cap.

version: "2026-10-09.1"
policy: always_low
decision_threshold: 0.95
estimates: routing_estimates.json
tier_map:
  low: gpt-6-luna
  medium: claude-haiku-4-5
  high: gpt-6.1-sol
verifier:
  sample_rate: 0.05
  daily_budget_usd: 0.50
# Failover for "auto" requests: when the tier's model fails with a retryable error (rate limit,
# timeout, connection, server error, auth) or its provider's circuit is open, the gateway tries these
# models in order, each on another provider, within one deadline for all attempts. A request that
# names a model never fails over: it gets that model or an error.
# The low tier falls back to claude-haiku-4-5, not gpt-oss-20b: under the same judge Haiku matched
# gpt-6-luna (97.1%) while gpt-oss-20b dropped to 85.3%, at twelve times luna's cost during an outage
# instead of about the same (results/slice3_fallback_quality.md).
failover:
  deadline_seconds: 90
  fallbacks:
    low: [claude-haiku-4-5]
    medium: [gpt-oss-120b]
    high: [claude-sonnet-5-5]
# Per-provider circuit breaker. A circuit opens when, over the shared 60 s window and at least
# min_calls calls, the share of failed calls (rate limit, timeout, connection, server error, auth)
# reaches error_rate_threshold, or the p95 latency of successful calls passes p95_budget_ms. It stays
# open open_seconds, then lets one probe through; the probe closes it or opens it again. The p95
# budget sits above the slowest recorded p95 (gpt-6.1-sol, 16.5 s), so normal traffic never trips it.
breaker:
  error_rate_threshold: 0.5
  min_calls: 10
  p95_budget_ms: 30000
  open_seconds: 15
  probe_lease_seconds: 70
