name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      # Offline: no provider key is set, and the published numbers are regenerated from the
      # committed recording (the gate test) instead of calling any model.
      - name: Tests and the published-numbers gate
        run: uv run pytest -q
