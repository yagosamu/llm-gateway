name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The same Redis as compose.yaml, for the tests that need the real Query Engine (vector search);
    # locally they are skipped when no Redis answers.
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full version tags only; there is no moving v10 tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      # Offline: no provider key is set, and the published numbers are regenerated from the
      # committed recording (the gate test) instead of calling any model.
      - name: Tests and the published-numbers gate
        run: uv run pytest -q
